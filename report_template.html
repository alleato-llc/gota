<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--
  Gota report template. report.py substitutes three things into this file and writes a
  finished, self-contained report.html: the report title, the embedded results.json
  (a JS object literal, or null for an empty viewer), and the generation date. The
  placeholder tokens are intentionally not written out here, so the substitution does
  not pollute this comment. Everything else is static; edit this file to restyle the
  report, and the script does not need to change.
-->
<style>
  :root {
    color-scheme: light dark;
    --accent: #6366f1;
    --accent2: #06b6d4;
    --accent-strong: #4338ca;
    --bg: #f6f7fb;
    --card: #ffffff;
    --border: #e6e6ef;
    --text: #1a1a22;
    --muted: #6b7280;
    --header-grad: linear-gradient(135deg, #6366f1, #06b6d4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent-strong: #a5b4fc;
      --bg: #14151a;
      --card: #1d1f27;
      --border: #2b2e3a;
      --text: #e9e9f0;
      --muted: #9aa3b2;
      --header-grad: linear-gradient(135deg, #4f46e5, #0891b2);
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 2rem 1.25rem; max-width: 62rem; margin-inline: auto;
    color: var(--text); background: var(--bg);
  }
  h1 {
    font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -0.01em;
    background: var(--header-grad); -webkit-background-clip: text;
    background-clip: text; color: transparent; display: inline-block;
  }
  .muted { color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; margin: 1.25rem 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(40,40,90,.04);
  }
  .controls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  input[type=file] { font: inherit; }
  input[type=file]::file-selector-button {
    font: inherit; border: 0; border-radius: 8px; padding: .4rem .8rem; cursor: pointer;
    color: #fff; background: var(--header-grad); margin-right: .6rem;
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: .55rem .8rem; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    background: var(--header-grad); color: #fff; cursor: pointer; user-select: none;
    position: sticky; top: 0; font-weight: 600;
  }
  thead th:first-child { border-top-left-radius: 10px; }
  thead th:last-child { border-top-right-radius: 10px; }
  thead th:hover { filter: brightness(1.06); }
  th .arrow { opacity: .55; font-size: .8em; margin-left: .25rem; }
  th.sorted .arrow { opacity: 1; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--card) 92%, var(--accent)); }
  tbody tr:hover td { background: color-mix(in srgb, var(--card) 84%, var(--accent)); }
  td { border-bottom: 1px solid var(--border); }
  .pill {
    display: inline-block; padding: .12rem .6rem; border-radius: 999px;
    font-weight: 600; font-size: .85rem; color: #fff;
  }
  .cell { position: relative; display: flex; justify-content: flex-end; align-items: center; min-width: 130px; }
  .bar {
    position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 5px;
    background: var(--row, var(--accent)); opacity: .20;
  }
  .val { position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
  td.best .bar { opacity: .42; }
  td.best .val { font-weight: 700; }
  td.best .val::after { content: " ★"; color: var(--accent-strong); font-size: .8em; }
  .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; font-size: .9rem; }
  .meta-grid dt { color: var(--muted); }
  .meta-grid dd { margin: 0; }
  code { background: color-mix(in srgb, var(--card) 70%, var(--accent)); border-radius: 5px; padding: .05rem .35rem; }
  .legend { display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: center; margin-top: .6rem; }
  .legend .pill { font-size: .8rem; }
  .chead { font-size: 1.05rem; margin: .1rem 0 .7rem; }
  .chead .muted { font-size: .85rem; font-weight: 400; }
  .warn { color: #b45309; font-size: .85rem; margin: .1rem 0 .5rem; }
  @media (prefers-color-scheme: dark) { .warn { color: #fbbf24; } }
  .delta { margin-left: .5rem; font-size: .82rem; font-variant-numeric: tabular-nums; opacity: .85; }
  .tag { font-size: .75rem; color: var(--muted); }
  select { font: inherit; padding: .2rem .45rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  footer { margin-top: 1.5rem; }
</style>
</head>
<body>
  <h1 id="title">__TITLE__</h1>
  <div class="muted" id="subtitle"></div>

  <div class="card">
    <div class="controls">
      <label><strong>Load results.json:</strong> <input type="file" id="file" multiple accept=".json,application/json"></label>
      <span class="muted">pick two or more to compare against a baseline</span>
      <span class="muted" id="status"></span>
    </div>
  </div>

  <div id="report"></div>

  <footer class="muted">
    Generated by <code>gota/report.py</code> on __GENERATED__. Bars show each value
    relative to the fastest in its column; ★ marks the best. Numbers are peak of
    batches; higher is better. The page only shows what the loaded results.json holds.
  </footer>

<script>
const EMBEDDED = __DATA__;

// A small, distinct, colorblind-friendly-ish palette assigned per implementation.
const PALETTE = ["#6366f1", "#06b6d4", "#10b981", "#f59e0b", "#f43f5e", "#8b5cf6", "#14b8a6", "#f97316", "#0ea5e9", "#84cc16"];

const fmt = (n, unit) =>
  n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
  (unit ? " " + unit : "");

function pivot(doc) {
  const rows = doc.results || [];
  const impls = [], benches = [];
  const by = {};
  for (const r of rows) {
    if (!impls.includes(r.impl)) impls.push(r.impl);
    if (!benches.includes(r.bench)) benches.push(r.bench);
    (by[r.impl] = by[r.impl] || {})[r.bench] = r.mbps;
  }
  return { impls, benches, by };
}

let state = null;

// Loaded runs accumulate here; one run renders the single-run view, two or more render
// the comparison view. `baselineLabel`/`tolerance` come from a report.py-embedded
// comparison wrapper, or default, and the in-page baseline picker can change them.
let loadedRuns = [];
let baselineLabel = null;
let tolerance = 0.02;

function ingest(docs, opts) {
  opts = opts || {};
  for (const d of docs) {
    if (!d) continue;
    if (!d.label) d.label = "run " + (loadedRuns.length + 1);
    const i = loadedRuns.findIndex(r => r.label === d.label);
    if (i >= 0) loadedRuns[i] = d; else loadedRuns.push(d);
  }
  if (opts.tolerance != null) tolerance = opts.tolerance;
  if (opts.baseline) baselineLabel = opts.baseline;
  if (!baselineLabel && loadedRuns.length) baselineLabel = loadedRuns[0].label;
  show();
}

function show() {
  const status = document.getElementById("status");
  if (!loadedRuns.length) {
    document.getElementById("report").innerHTML =
      '<div class="card muted">No data loaded. Choose a results.json above.</div>';
    document.getElementById("subtitle").textContent = "";
    status.textContent = "";
    return;
  }
  if (loadedRuns.length === 1) renderSingle(loadedRuns[0]);
  else renderComparison();
}

function renderSingle(doc) {
  const status = document.getElementById("status");
  const { impls, benches, by } = pivot(doc);
  const unit = (doc.units || "").split(/\s+/)[0] || "";
  const color = {};
  impls.forEach((i, k) => color[i] = PALETTE[k % PALETTE.length]);
  state = { impls, benches, by, unit, color, sortBench: null, asc: false };

  const bits = [];
  if (doc.machine) bits.push(doc.machine);
  if (doc.os) bits.push(doc.os);
  if (doc.date) bits.push(doc.date);
  if (doc.git_commit && doc.git_commit !== "unknown") bits.push("commit " + doc.git_commit);
  document.getElementById("subtitle").textContent = bits.join("  ·  ");
  status.textContent = impls.length + " implementations, " + benches.length + " benchmarks";

  const p = doc.params || {};
  const paramRows = Object.keys(p).map(k => `<dt>${k}</dt><dd><code>${p[k]}</code></dd>`).join("");
  const legend = impls.map(i =>
    `<span class="pill" style="background:${color[i]}">${i}</span>`).join("");
  const metaCard = `<div class="card"><div class="meta-grid">
    ${paramRows}${doc.units ? `<dt>units</dt><dd>${doc.units}</dd>` : ""}
  </div><div class="legend">${legend}</div></div>`;

  document.getElementById("report").innerHTML = metaCard + '<div class="card" id="tablecard"></div>';
  drawTable();
}

function drawTable() {
  const { impls, benches, by, unit, color, sortBench, asc } = state;

  const best = {};
  for (const b of benches) {
    best[b] = Math.max(...impls.map(i => (by[i] || {})[b]).filter(v => v != null));
  }

  let order = impls.slice();
  if (sortBench === "__impl__") {
    order.sort((x, y) => asc ? x.localeCompare(y) : y.localeCompare(x));
  } else if (sortBench !== null) {
    order.sort((x, y) => {
      const a = (by[x] || {})[sortBench] ?? -Infinity, b = (by[y] || {})[sortBench] ?? -Infinity;
      return asc ? a - b : b - a;
    });
  }

  const arrow = key => `<span class="arrow">${sortBench === key && asc ? "▲" : "▼"}</span>`;

  let html = "<table><thead><tr>";
  html += `<th data-key="__impl__" class="${sortBench === "__impl__" ? "sorted" : ""}">Implementation ${arrow("__impl__")}</th>`;
  for (const b of benches) {
    html += `<th data-key="${b}" class="${sortBench === b ? "sorted" : ""}">${b} ${arrow(b)}</th>`;
  }
  html += "</tr></thead><tbody>";
  for (const i of order) {
    html += `<tr style="--row:${color[i]}"><td><span class="pill" style="background:${color[i]}">${i}</span></td>`;
    for (const b of benches) {
      const v = (by[i] || {})[b];
      if (v == null) { html += `<td class="num">—</td>`; continue; }
      const p = best[b] > 0 ? Math.max(2, (v / best[b]) * 100) : 0;
      const cls = "num" + (v === best[b] ? " best" : "");
      html += `<td class="${cls}"><div class="cell"><div class="bar" style="width:${p}%"></div><span class="val">${fmt(v, unit)}</span></div></td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("tablecard").innerHTML = html;

  document.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (state.sortBench === key) state.asc = !state.asc;
      else { state.sortBench = key; state.asc = false; }
      drawTable();
    });
  });
}

// --- Comparison view: a baseline run plus one or more candidate runs ---------------

function indexDoc(doc) {
  const by = {};
  for (const r of (doc.results || [])) (by[r.impl] = by[r.impl] || {})[r.bench] = r.mbps;
  return by;
}

// Surface differences that make a numeric delta misleading, rather than hiding them.
function provenanceWarnings(base, cand) {
  const w = [];
  if (base.machine && cand.machine && base.machine !== cand.machine)
    w.push(`machine differs (${base.machine} vs ${cand.machine}) — deltas are not comparable`);
  if (base.os && cand.os && base.os !== cand.os)
    w.push(`OS differs (${base.os} vs ${cand.os})`);
  const bp = base.params || {}, cp = cand.params || {};
  for (const k of [...new Set([...Object.keys(bp), ...Object.keys(cp)])].sort())
    if (String(bp[k]) !== String(cp[k]))
      w.push(`param ${k} differs (${bp[k]} vs ${cp[k]}) — runs measure different work`);
  if (base.units && cand.units && base.units !== cand.units)
    w.push(`units differ (${base.units} vs ${cand.units})`);
  return w;
}

function deltaStyle(pct) {
  const band = tolerance * 100;
  if (pct >= band || pct <= -band) {
    const a = Math.min(0.42, 0.06 + Math.abs(pct) / 40 * 0.42);
    return `background: rgba(${pct > 0 ? "16,185,129" : "244,63,94"},${a.toFixed(3)})`;
  }
  return "";
}

function valuesTable(impls, benches, by, color, unit) {
  const best = {};
  for (const b of benches) best[b] = Math.max(...impls.map(i => (by[i] || {})[b]).filter(v => v != null));
  let h = "<table><thead><tr><th>Implementation</th>" + benches.map(b => `<th>${b}</th>`).join("") + "</tr></thead><tbody>";
  for (const i of impls) {
    h += `<tr style="--row:${color[i]}"><td><span class="pill" style="background:${color[i]}">${i}</span></td>`;
    for (const b of benches) {
      const v = (by[i] || {})[b];
      if (v == null) { h += "<td>—</td>"; continue; }
      const p = best[b] > 0 ? Math.max(2, v / best[b] * 100) : 0;
      h += `<td class="${v === best[b] ? "best" : ""}"><div class="cell"><div class="bar" style="width:${p}%"></div><span class="val">${fmt(v, unit)}</span></div></td>`;
    }
    h += "</tr>";
  }
  return h + "</tbody></table>";
}

function deltaTable(impls, benches, baseBy, candBy, color, unit) {
  let h = "<table><thead><tr><th>Implementation</th>" + benches.map(b => `<th>${b}</th>`).join("") + "</tr></thead><tbody>";
  for (const i of impls) {
    h += `<tr style="--row:${color[i]}"><td><span class="pill" style="background:${color[i]}">${i}</span></td>`;
    for (const b of benches) {
      const base = (baseBy[i] || {})[b], cand = (candBy[i] || {})[b];
      if (base == null && cand == null) { h += "<td>—</td>"; continue; }
      if (base == null) { h += `<td><div class="cell"><span class="val">${fmt(cand, unit)}</span><span class="tag">&nbsp;new</span></div></td>`; continue; }
      if (cand == null) { h += `<td><span class="tag">gone</span></td>`; continue; }
      const pct = (cand / base - 1) * 100;
      h += `<td style="${deltaStyle(pct)}"><div class="cell"><span class="val" title="${fmt(base, unit)} → ${fmt(cand, unit)}">${fmt(cand, unit)}</span><span class="delta">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</span></div></td>`;
    }
    h += "</tr>";
  }
  return h + "</tbody></table>";
}

function renderComparison() {
  let base = loadedRuns.find(r => r.label === baselineLabel);
  if (!base) { base = loadedRuns[0]; baselineLabel = base.label; }
  const cands = loadedRuns.filter(r => r !== base);
  const unit = (base.units || "").split(/\s+/)[0] || "";

  const impls = [], benches = [];
  for (const d of [base, ...cands]) for (const r of (d.results || [])) {
    if (!impls.includes(r.impl)) impls.push(r.impl);
    if (!benches.includes(r.bench)) benches.push(r.bench);
  }
  const color = {};
  impls.forEach((i, k) => color[i] = PALETTE[k % PALETTE.length]);

  document.getElementById("subtitle").textContent = "comparison · baseline " + base.label;
  document.getElementById("status").textContent =
    `${loadedRuns.length} runs · ${impls.length} implementations · ${benches.length} benchmarks`;

  const opts = loadedRuns.map(r => `<option ${r.label === baselineLabel ? "selected" : ""}>${r.label}</option>`).join("");
  const legend = impls.map(i => `<span class="pill" style="background:${color[i]}">${i}</span>`).join("");
  let html = `<div class="card"><div class="meta-grid">
    <dt>baseline</dt><dd><select id="baseline">${opts}</select></dd>
    ${base.machine ? `<dt>machine</dt><dd>${base.machine}</dd>` : ""}
    ${base.units ? `<dt>units</dt><dd>${base.units}</dd>` : ""}
    <dt>tolerance</dt><dd>±${(tolerance * 100).toFixed(1)}% — changes within the band are not flagged</dd>
  </div><div class="legend">${legend}</div></div>`;

  const baseBy = indexDoc(base);
  html += `<div class="card"><div class="chead">${base.label} <span class="muted">(baseline)</span></div>`
        + valuesTable(impls, benches, baseBy, color, unit) + "</div>";

  for (const c of cands) {
    const warns = provenanceWarnings(base, c).map(w => `<div class="warn">⚠️ ${w}</div>`).join("");
    html += `<div class="card"><div class="chead">${c.label} <span class="muted">vs ${base.label}</span></div>${warns}`
          + deltaTable(impls, benches, baseBy, indexDoc(c), color, unit) + "</div>";
  }

  document.getElementById("report").innerHTML = html;
  const sel = document.getElementById("baseline");
  if (sel) sel.addEventListener("change", () => { baselineLabel = sel.value; show(); });
}

document.getElementById("file").addEventListener("change", e => {
  const files = [...e.target.files];
  if (!files.length) return;
  let pending = files.length;
  const collected = [];
  files.forEach(f => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed && parsed.runs) {
          if (parsed.baseline) baselineLabel = parsed.baseline;
          if (parsed.tolerance != null) tolerance = parsed.tolerance;
          collected.push(...parsed.runs);
        } else {
          if (!parsed.label) parsed.label = f.name.replace(/\.json$/, "");
          collected.push(parsed);
        }
      } catch (err) {
        document.getElementById("status").textContent = "Could not parse " + f.name + ": " + err.message;
      }
      if (--pending === 0) ingest(collected, {});
    };
    reader.readAsText(f);
  });
});

if (EMBEDDED && EMBEDDED.runs) ingest(EMBEDDED.runs, { baseline: EMBEDDED.baseline, tolerance: EMBEDDED.tolerance });
else if (EMBEDDED) ingest([EMBEDDED], {});
else show();
</script>
</body>
</html>
