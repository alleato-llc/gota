<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gota example: FNV-1a throughput</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 2rem; max-width: 60rem; margin-inline: auto;
    color: #1a1a1a; background: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #16181c; }
    .card { background: #1e2127 !important; border-color: #2c313a !important; }
    th { background: #232730 !important; }
    tbody tr:hover td { background: #232730 !important; }
    .muted { color: #9aa3af !important; }
    code { background: #2c313a !important; }
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .muted { color: #666; font-size: .9rem; }
  .card {
    background: #fff; border: 1px solid #e4e4e7; border-radius: 10px;
    padding: 1rem 1.25rem; margin: 1.25rem 0;
  }
  .controls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  input[type=file] { font: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: .5rem .75rem; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    background: #f4f4f5; border-bottom: 2px solid #e4e4e7; cursor: pointer;
    user-select: none; position: sticky; top: 0;
  }
  thead th:hover { filter: brightness(0.97); }
  th .arrow { opacity: .4; font-size: .8em; margin-left: .25rem; }
  th.sorted .arrow { opacity: 1; }
  tbody tr:hover td { background: #f7f7f8; }
  td.best { font-weight: 700; }
  td.num { font-variant-numeric: tabular-nums; }
  .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: .15rem 1rem; font-size: .9rem; }
  .meta-grid dt { color: #666; }
  .meta-grid dd { margin: 0; }
  code { background: #f1f1f2; border-radius: 4px; padding: .05rem .3rem; }
  footer { margin-top: 1.5rem; }
</style>
</head>
<body>
  <h1 id="title">Gota example: FNV-1a throughput</h1>
  <div class="muted" id="subtitle"></div>

  <div class="card">
    <div class="controls">
      <label><strong>Load results.json:</strong> <input type="file" id="file" accept=".json,application/json"></label>
      <span class="muted" id="status"></span>
    </div>
  </div>

  <div id="report"></div>

  <footer class="muted">
    Generated by <code>gota/report.py</code> on 2026-06-20. Numbers are peak of
    batches; higher is better. The page only shows what the loaded results.json
    contains.
  </footer>

<script>
const EMBEDDED = {"machine": "Apple M4 Max", "os": "Darwin arm64", "date": "2026-06-20", "git_commit": "e5be0a2", "params": {"buffer_bytes": 65536, "warmup_s": 0.5, "measure_s": 1.5}, "units": "MB/s (decimal, 1e6 bytes), peak of batches", "results": [{"impl": "python", "bench": "fnv1a-64", "mbps": 19.31, "iters": 448}, {"impl": "c", "bench": "fnv1a-64", "mbps": 1116.44, "iters": 26624}, {"impl": "go", "bench": "fnv1a-64", "mbps": 1097.78, "iters": 26624}, {"impl": "rust", "bench": "fnv1a-64", "mbps": 1105.54, "iters": 26624}]};

const fmt = (n, unit) =>
  n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
  (unit ? " " + unit : "");

function pivot(doc) {
  const rows = doc.results || [];
  const impls = [], benches = [];
  const by = {};
  for (const r of rows) {
    if (!impls.includes(r.impl)) impls.push(r.impl);
    if (!benches.includes(r.bench)) benches.push(r.bench);
    (by[r.impl] = by[r.impl] || {})[r.bench] = r.mbps;
  }
  return { impls, benches, by };
}

let state = null; // { impls, benches, by, unit }

function render(doc) {
  const status = document.getElementById("status");
  if (!doc || !(doc.results || []).length) {
    document.getElementById("report").innerHTML =
      '<div class="card muted">No data loaded. Choose a results.json above.</div>';
    document.getElementById("subtitle").textContent = "";
    status.textContent = "";
    return;
  }
  const { impls, benches, by } = pivot(doc);
  const unit = (doc.units || "").split(/\s+/)[0] || "";
  state = { impls, benches, by, unit, sortBench: null, asc: false };

  // Subtitle from provenance.
  const bits = [];
  if (doc.machine) bits.push(doc.machine);
  if (doc.os) bits.push(doc.os);
  if (doc.date) bits.push(doc.date);
  if (doc.git_commit && doc.git_commit !== "unknown") bits.push("commit " + doc.git_commit);
  document.getElementById("subtitle").textContent = bits.join("  ·  ");

  status.textContent = impls.length + " implementations, " + benches.length + " benchmarks";

  // Params + units card.
  const p = doc.params || {};
  const paramRows = Object.keys(p).map(k => `<dt>${k}</dt><dd><code>${p[k]}</code></dd>`).join("");
  const metaCard = `<div class="card"><div class="meta-grid">
    ${paramRows}
    ${doc.units ? `<dt>units</dt><dd>${doc.units}</dd>` : ""}
  </div></div>`;

  document.getElementById("report").innerHTML = metaCard + '<div class="card" id="tablecard"></div>';
  drawTable();
}

function drawTable() {
  const { impls, benches, by, unit, sortBench, asc } = state;

  // Best (max) per bench, for highlighting.
  const best = {};
  for (const b of benches) {
    best[b] = Math.max(...impls.map(i => (by[i] || {})[b]).filter(v => v != null));
  }

  // Row order: by a chosen bench, else original.
  let order = impls.slice();
  if (sortBench !== null && sortBench !== "__impl__") {
    order.sort((x, y) => {
      const vx = (by[x] || {})[sortBench], vy = (by[y] || {})[sortBench];
      const a = vx == null ? -Infinity : vx, b = vy == null ? -Infinity : vy;
      return asc ? a - b : b - a;
    });
  } else if (sortBench === "__impl__") {
    order.sort((x, y) => asc ? x.localeCompare(y) : y.localeCompare(x));
  }

  const arrow = key => sortBench === key ? `<span class="arrow">${asc ? "▲" : "▼"}</span>` : `<span class="arrow">▼</span>`;

  let html = "<table><thead><tr>";
  html += `<th data-key="__impl__" class="${sortBench === "__impl__" ? "sorted" : ""}">Implementation ${arrow("__impl__")}</th>`;
  for (const b of benches) {
    html += `<th data-key="${b}" class="${sortBench === b ? "sorted" : ""}">${b} ${arrow(b)}</th>`;
  }
  html += "</tr></thead><tbody>";
  for (const i of order) {
    html += `<tr><td>${i}</td>`;
    for (const b of benches) {
      const v = (by[i] || {})[b];
      const cls = "num" + (v != null && v === best[b] ? " best" : "");
      html += `<td class="${cls}">${v != null ? fmt(v, unit) : "—"}</td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("tablecard").innerHTML = html;

  document.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (state.sortBench === key) state.asc = !state.asc;
      else { state.sortBench = key; state.asc = false; }
      drawTable();
    });
  });
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { render(JSON.parse(reader.result)); }
    catch (err) { document.getElementById("status").textContent = "Could not parse: " + err.message; }
  };
  reader.readAsText(f);
});

render(EMBEDDED);
</script>
</body>
</html>
